services:
  api:
    # Root context: backend/Dockerfile copies backend/ and tools/clip/ (the
    # root .dockerignore keeps the context to just those two).
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      PORT: "8090"
      DB_PATH: /data/hube.db
      HUBE_API_TOKEN: ${HUBE_API_TOKEN}
      MONKEYAPI_URL: ${MONKEYAPI_URL:-}
      MONKEYAPI_KEY: ${MONKEYAPI_KEY:-}
    volumes:
      - db-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8090/health"]
      interval: 10s
      timeout: 3s
      retries: 3

  web:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  db-data:
